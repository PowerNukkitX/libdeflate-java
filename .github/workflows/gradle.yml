name: Java CI with Gradle

on:
  push:
    branches: [ master, 0.0.3.PNX-3.1.0 ]
  pull_request:
    branches: [ master ]

jobs:
  linux-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm

    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: chmod +x gradlew

      - name: Build native library
        run: ./gradlew :libdeflate-java-core:compileNatives
        env:
          CC: gcc

      - uses: actions/upload-artifact@v4
        with:
          name: Linux-${{ matrix.arch }}
          path: ./tmp/compiled/linux/${{ matrix.arch }}/libdeflate_jni.so
          if-no-files-found: error

  macos-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: aarch64
            runner: macos-15

    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: chmod +x gradlew

      - name: Build native library
        run: ./gradlew :libdeflate-java-core:compileNatives

      - uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.arch }}
          path: ./tmp/compiled/darwin/${{ matrix.arch }}/libdeflate_jni.dylib
          if-no-files-found: error

  windows-amd64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Build natives
        run: ./gradlew compileNatives
        env:
          MSVC: true

      - uses: actions/upload-artifact@v4
        with:
          name: Windows-amd64
          path: ./tmp/compiled/windows/amd64/libdeflate_jni.dll
          if-no-files-found: error

  publish:
    needs:
      - linux-native
      - macos-native
      - windows-amd64
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/download-artifact@v4
        with:
          name: Linux-amd64
          path: ./tmp/compiled/linux/amd64

      - uses: actions/download-artifact@v4
        with:
          name: Linux-aarch64
          path: ./tmp/compiled/linux/aarch64

      - uses: actions/download-artifact@v4
        with:
          name: macOS-x86_64
          path: ./tmp/compiled/darwin/x86_64

      - uses: actions/download-artifact@v4
        with:
          name: macOS-aarch64
          path: ./tmp/compiled/darwin/aarch64

      - uses: actions/download-artifact@v4
        with:
          name: Windows-amd64
          path: ./tmp/compiled/windows/amd64

      - run: chmod +x gradlew

      - name: Publish universal native artifact
        run: ./gradlew publish
        env:
          CC: gcc
          ci: true
          PNX_REPO_USERNAME: ${{ secrets.PNX_REPO_USERNAME }}
          PNX_REPO_PASSWORD: ${{ secrets.PNX_REPO_PASSWORD }}
