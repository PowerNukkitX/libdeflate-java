name: Java CI with Gradle

on:
  push:
    branches: [ master, 0.0.3.PNX-3.1.0 ]
  pull_request:
    branches: [ master ]

jobs:
  linux-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm

    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: chmod +x gradlew

      - name: Build native library
        run: ./gradlew :libdeflate-java-core:compileNatives
        env:
          CC: gcc

      - uses: actions/upload-artifact@v4
        with:
          name: Linux-${{ matrix.arch }}
          path: ./tmp/compiled/linux/${{ matrix.arch }}/libdeflate_jni.so
          if-no-files-found: error

  macos-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: aarch64
            runner: macos-15

    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: chmod +x gradlew

      - name: Build native library
        run: ./gradlew :libdeflate-java-core:compileNatives

      - uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.arch }}
          path: ./tmp/compiled/darwin/${{ matrix.arch }}/libdeflate_jni.dylib
          if-no-files-found: error

  linux-musl-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm

    name: Linux musl ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build musl native library
        run: |
          docker run --rm --user root \
            -v "$PWD:/workspace" \
            -w /workspace/libdeflate-java-core \
            alpine:3.20 \
            sh -lc '
              apk add --no-cache build-base openjdk17-jdk &&
              export JAVA_HOME=/usr/lib/jvm/java-17-openjdk &&
              export CFLAGS="-O2 -fomit-frame-pointer -Werror -Wall -fPIC -flto -D_POSIX_C_SOURCE=200809L" &&
              make clean all \
                CC=gcc \
                LIB_NAME=libdeflate_jni \
                DYLIB_SUFFIX=so \
                JNI_PLATFORM=linux \
                LIB_DIR=/workspace/tmp/compiled/linux-musl/${{ matrix.arch }} \
                OBJ_DIR=/workspace/tmp/objects/linux-musl/${{ matrix.arch }}
            '

      - uses: actions/upload-artifact@v4
        with:
          name: Linux-musl-${{ matrix.arch }}
          path: ./tmp/compiled/linux-musl/${{ matrix.arch }}/libdeflate_jni.so
          if-no-files-found: error

  windows-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
            msvc_arch: amd64
            java_version: 17
          - arch: aarch64
            runner: windows-11-vs2026-arm
            msvc_arch: arm64
            java_version: 21

    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK ${{ matrix.java_version }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java_version }}

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Build natives
        run: ./gradlew compileNatives
        env:
          MSVC: true

      - uses: actions/upload-artifact@v4
        with:
          name: Windows-${{ matrix.arch }}
          path: ./tmp/compiled/windows/${{ matrix.arch }}/libdeflate_jni.dll
          if-no-files-found: error

  publish:
    needs:
      - linux-native
      - linux-musl-native
      - macos-native
      - windows-native
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/download-artifact@v4
        with:
          name: Linux-amd64
          path: ./tmp/compiled/linux/amd64

      - uses: actions/download-artifact@v4
        with:
          name: Linux-aarch64
          path: ./tmp/compiled/linux/aarch64

      - uses: actions/download-artifact@v4
        with:
          name: macOS-x86_64
          path: ./tmp/compiled/darwin/x86_64

      - uses: actions/download-artifact@v4
        with:
          name: macOS-aarch64
          path: ./tmp/compiled/darwin/aarch64

      - uses: actions/download-artifact@v4
        with:
          name: Linux-musl-amd64
          path: ./tmp/compiled/linux-musl/amd64

      - uses: actions/download-artifact@v4
        with:
          name: Linux-musl-aarch64
          path: ./tmp/compiled/linux-musl/aarch64

      - uses: actions/download-artifact@v4
        with:
          name: Windows-amd64
          path: ./tmp/compiled/windows/amd64

      - uses: actions/download-artifact@v4
        with:
          name: Windows-aarch64
          path: ./tmp/compiled/windows/aarch64

      - run: chmod +x gradlew

      - name: Publish universal native artifact
        run: ./gradlew publish
        env:
          CC: gcc
          ci: true
          PNX_REPO_USERNAME: ${{ secrets.PNX_REPO_USERNAME }}
          PNX_REPO_PASSWORD: ${{ secrets.PNX_REPO_PASSWORD }}
